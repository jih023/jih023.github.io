<header class="topbar">
  <button class="icon-btn menu-btn" type="button" aria-label="메뉴 열기">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
  <nav class="breadcrumb">
    {%- if page.url == '/blog/' -%}
    <span>Home</span>
    {%- else -%}
    <a href="{{ '/blog/' | relative_url }}">Home</a>
    <span class="crumb-sep">›</span>
    <span>{{ page.title | default: site.title | escape }}</span>
    {%- endif -%}
  </nav>
  <label class="search">
    <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 6 12l4.3 4.2-1.5 1.5-4.2-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
    <input id="search-input" type="search" placeholder="Search..." autocomplete="off" data-src="{{ '/search.json' | relative_url }}">
  </label>
</header>
