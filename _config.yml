# ─────────────────────────────────────────────
# 사이트 기본 정보 — 여기만 바꾸면 전체에 반영돼요
# ─────────────────────────────────────────────
title: jih023
author: jih023
description: 배우고 만든 것들을 기록합니다.
# 프로필 사진: assets/img/avatar.jpg 같은 경로. 비워두면 이름 첫 글자로 표시
avatar: "/assets/img/avatar.jpg"
email: ""
lang: ko
timezone: Asia/Seoul

url: "https://jih023.github.io"
baseurl: ""

github_username: jih023
github_repo: jih023/jih023.github.io
github_branch: main

# 글 목록 요약은 머리말의 description 을 써요 (자동 발췌 끔)
excerpt_separator: ""

# 글 주소: /blog/파일이름/
permalink: /blog/:title/

# 마크다운 / 코드 하이라이트
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-feed

feed:
  path: feed.xml

# _posts 안 글의 기본값
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
